databases:
  - name: portflio-db
    plan: free
    databaseName: portflio
    user: portflio

services:
  - type: web
    name: portflio
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn portfolio.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: portflio-db
          property: connectionString
